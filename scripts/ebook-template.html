<!doctype html>
<html lang="fr-CA">
<head>
<meta charset="utf-8" />
<title>Les 7 services qui peuvent te rapporter jusqu'à 900 $ par semaine cet été</title>
<style>
  @font-face { font-family: "Bebas Neue"; src: url("%FONT_TITRE%") format("woff2"); }
  @font-face { font-family: "Inter"; font-weight: 100 900; src: url("%FONT_TEXTE%") format("woff2"); }
  @page { size: Letter; margin: 0; }
  :root { --gazon: #0a0a0a; --peinture: #ffffff; --cone: #ffffff; --encre: #000000; --pale: #f1f1ef; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  body { font: 400 12.5pt/1.5 "Inter", sans-serif; color: var(--encre); }
  .page { width: 8.5in; height: 11in; padding: 0.8in 0.9in 0.9in; position: relative; overflow: hidden; background: var(--peinture); break-after: page; }
  .page:last-child { break-after: auto; }
  h1, h2, .chiffre { font-family: "Bebas Neue", sans-serif; font-weight: 400; text-transform: uppercase; line-height: 0.98; text-wrap: balance; }
  h1 { font-size: 48pt; margin-bottom: 0.28in; }
  h2 { font-size: 22pt; margin: 0.28in 0 0.06in; }
  p + p, ul + p, ol + p { margin-top: 0.14in; }
  .texte { font-size: 13pt; }
  .chiffre { line-height: 0.8; word-spacing: -0.08em; white-space: nowrap; }
  mark { background: #ffe94a; color: var(--encre); font-weight: 700; padding: 0 0.18em; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
  .pied { position: absolute; left: 0.9in; right: 0.9in; bottom: 0.42in; display: flex; justify-content: space-between; font-size: 9.5pt; font-weight: 600; }
  .gazon { background: var(--encre); color: var(--peinture); }
  blockquote { background: var(--encre); color: var(--peinture); padding: 0.22in 0.28in; margin-top: 0.28in; font-weight: 600; }
  ul, ol { padding-left: 1.3em; }
  li { margin-top: 0.07in; padding-left: 0.2em; }
  li::marker { font-weight: 800; color: var(--gazon); }
  a { color: inherit; }

  table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
  th { text-align: left; font-size: 10.5pt; font-weight: 800; padding: 0 0.1in 0.06in 0; vertical-align: bottom; }
  td { border-top: 1.5px solid #d5d5d5; padding: 0.07in 0.1in 0.07in 0; }
  .num { text-align: right; padding-right: 0; white-space: nowrap; }
  .total td { border-top: 3px solid var(--encre); font-weight: 800; }

  /* Couverture */
  .couverture { padding: 0.8in; }
  .cadeau { display: inline-block; background: var(--cone); color: var(--encre); font-weight: 800; font-size: 17pt; padding: 0.07in 0.24in; }
  .couverture .sept { display: block; font-size: 350pt; margin: 0.62in 0 0.62in -0.12in; }
  .couverture h1 { font-size: 58pt; margin: 0; }
  .couverture h1 + p { font-size: 17pt; font-weight: 600; margin-top: 0.22in; }
  .couverture .marque { position: absolute; bottom: 0.45in; left: 0.8in; font-weight: 800; font-size: 14pt; }

  /* Histoire : le placeholder doit sauter aux yeux. */
  .histoire h1 + p { font-size: 17pt; margin-bottom: 0.3in; }

  /* Fiches de service */
  .service { padding-top: 0; }
  .service header { margin: 0 -0.9in 0.28in; padding: 0.55in 0.9in 0.38in; display: flex; align-items: center; gap: 0.32in; border-bottom: 0.1in solid var(--encre); }
  .service header .chiffre { font-size: 100pt; }
  .service header h1 { font-size: 50pt; margin: 0; }
  .service header + p { font-size: 14.5pt; }
  .service h2 { font-size: 20pt; }
  .service td { padding-block: 0.052in; }
  .fiche { margin-top: 0.22in; display: grid; grid-template-columns: 1fr 1fr; background: var(--pale); }
  .fiche > div { padding: 0.15in 0.22in; }
  .fiche dt { font-weight: 800; font-size: 11pt; }
  .fiche dd { font-weight: 600; font-size: 12pt; line-height: 1.35; }
  .fiche dd b { display: block; font: 800 18pt/1.35 "Inter"; letter-spacing: -0.03em; }
  .service blockquote { margin-top: 0.24in; }

  .comparer { padding-inline: 0.6in; }
  .comparer .pied { left: 0.6in; right: 0.6in; }
  .comparer table { font-size: 10.5pt; line-height: 1.3; margin-bottom: 0.16in; }
  .comparer td:first-child { font-weight: 800; }
  .comparer td { padding-block: 0.1in; }
  .comparer .num { padding-right: 0.14in; text-align: left; }
  .comparer table + p { font-size: 11pt; }

  .ligne { border-bottom: 2px solid var(--encre); height: 0.36in; margin: 0 !important; }

  .pivot { display: flex; flex-direction: column; justify-content: center; }
  .pivot h1 { font-size: 84pt; }
  .pivot p { font-size: 17pt; font-weight: 600; max-width: 6in; }
  .pivot p:nth-last-of-type(-n + 2) { font: 400 38pt/1 "Bebas Neue"; text-transform: uppercase; margin-top: 0.3in; }
  .pivot p:nth-last-of-type(1) { margin-top: 0.12in; }

  .offre { padding: 0.6in 0.85in; font-size: 12pt; line-height: 1.42; }
  .offre h1 { font-size: 38pt; margin-bottom: 0.12in; }
  .offre h1 + p { font-size: 16pt; font-weight: 700; }
  .offre .prix { display: block; font-size: 200pt; margin: 0.26in 0 0.26in -0.06in; }
  .offre .prix + p { font-size: 15pt; font-weight: 800; }
  .offre ul { list-style: none; padding: 0; margin: 0.14in 0 0.2in; }
  .offre li { padding: 0; }
  .offre .bouton { display: block; background: var(--cone); color: var(--encre); font-weight: 800; font-size: 20pt; line-height: 1.2; text-align: center; text-decoration: none; padding: 0.16in; border-radius: 8px; margin: 0.2in 0 0.06in; }
  .offre .adresse { text-align: center; font-weight: 700; font-size: 11pt; margin-bottom: 0.1in; }
  .offre .aussi { text-align: center; font-weight: 700; font-size: 11.5pt; margin: 0.04in 0 0.14in; }
  .offre .aussi a { text-decoration: underline; }
  .offre .aussi + p { font-size: 10.5pt; }

  .valider { padding: 0.6in 0.6in; font-size: 10pt; line-height: 1.3; }
  .valider h1 { font-size: 30pt; margin-bottom: 0.12in; }
  .valider table { margin-top: 0.16in; }
  .valider td { padding-block: 0.018in; }
  .valider .num { padding-right: 0.12in; }
  .valider .pied { left: 0.6in; right: 0.6in; bottom: 0.3in; }
  .valider .total td { border-top-width: 1.5px; background: var(--pale); }
</style>
</head>
<body>%PAGES%</body>
</html>
